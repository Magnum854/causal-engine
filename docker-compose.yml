services:
  causalflow:
    build:
      context: .
      dockerfile: Dockerfile
    restart: unless-stopped
    ports:
      - "${CAUSAL_PORT:-8000}:8000"
    environment:
      PORT: "8000"
      CAUSAL_V2_DB: /app/data/causal_v2.sqlite3
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      OPENAI_BASE_URL: "${OPENAI_BASE_URL:-https://api.deepseek.com/v1}"
      OPENAI_MODEL: "${OPENAI_MODEL:-deepseek-chat}"
      TAVILY_API_KEY: "${TAVILY_API_KEY:-}"
      SERPER_API_KEY: "${SERPER_API_KEY:-}"
      QVERIS_API_KEY: "${QVERIS_API_KEY:-}"
      CORS_ORIGINS: "${CORS_ORIGINS:-http://localhost:8000}"
    volumes:
      - causalflow-data:/app/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health', timeout=3)"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3

volumes:
  causalflow-data:
